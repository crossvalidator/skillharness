[project]
name = "skillharness"
version = "0.1.0.dev0"
description = "Run an Agent Skill folder as a bounded, recorded run on any model: sandboxed commands, a hard budget, typed events."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[anthropic,openai]>=2.56.0",
    "pyyaml>=6",
    "obstore>=0.12",
]

[project.optional-dependencies]
modal = ["modal>=1.6"]

[project.scripts]
skillharness = "skillharness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "matplotlib>=3.9",  # the example chart skill's render command, run by the tests
]

[build-system]
requires = ["uv_build>=0.6,<0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "skillharness"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
